version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend
      - redis-network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - backend

  # nestjs-app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: nestjs-app
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_HOST: postgres
  #     DATABASE_PORT: 5432
  #     DATABASE_USER: ${DB_USERNAME}
  #     DATABASE_PASSWORD: ${DB_PASSWORD}
  #     DATABASE_NAME: ${DB_NAME}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     CORS_ORIGINE: ${CORS_ORIGINE}
  #     PORT: 3000
  #     NODE_ENV: production
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
  redis-network:
    name: redis-network